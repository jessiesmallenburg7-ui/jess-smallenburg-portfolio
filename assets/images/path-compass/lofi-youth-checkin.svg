.0">Mood-first sequencing — tested against</tspan><tspan x="414.0" dy="13.0">questions-first; lower-stakes entry point</tspan></text><line x1="246.5" y1="274.0" x2="410.0" y2="395.0" stroke="#8A8A8A" stroke-width="1" stroke-dasharray="2 2"/><circle cx="246.5" cy="274.0" r="2" fill="#8A8A8A" stroke="#8A8A8A" stroke-width="1.2"/><text x="414.0" y="398.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="italic" fill="#8A8A8A" text-anchor="start"><tspan x="414.0" dy="0.0">Discrete response options — tested against</tspan><tspan x="414.0" dy="13.0">open text; reduces pressure to over-disclose</tspan></text><line x1="352.0" y1="401.0" x2="410.0" y2="495.0" stroke="#8A8A8A" stroke-width="1" stroke-dasharray="2 2"/><circle cx="352.0" cy="401.0" r="2" fill="#8A8A8A" stroke="#8A8A8A" stroke-width="1.2"/><text x="414.0" y="498.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="italic" fill="#8A8A8A" text-anchor="start"><tspan x="414.0" dy="0.0">Privacy surfaced before input — early wireframes</tspan><tspan x="414.0" dy="13.0">buried it as a footnote; trauma-informed</tspan><tspan x="414.0" dy="13.0">research argues control cues must be visible upfront</tspan></text><line x1="352.0" y1="522.0" x2="410.0" y2="595.0" stroke="#8A8A8A" stroke-width="1" stroke-dasharray="2 2"/><circle cx="352.0" cy="522.0" r="2" fill="#8A8A8A" stroke="#8A8A8A" stroke-width="1.2"/><text x="414.0" y="598.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="italic" fill="#8A8A8A" text-anchor="start"><tspan x="414.0" dy="0.0">Bottom nav — Check-in is one</tspan><tspan x="414.0" dy="13.0">of several youth-owned spaces</tspan></text></svg>